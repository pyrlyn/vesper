# Gradle build of the Kotlin/Native core (PLAN.md, section 6) plus the workflow lint. Job names
# `<os> (<target>)` are the checks to require on main (T29).
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Workflow lint: jactionlint with .github/jactionlint.yaml and its baseline, the check the
  # pre-push hook (hk.pkl) runs. install_args installs only jactionlint; its version matches
  # mise.toml. shellcheck comes from the runner image.
  jactionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: github:jdx/jactionlint@2.0.2
      - run: jactionlint --color

  # Which runner the macOS job uses: pyrlyn/ci's macos-runner action reads the MACOS_RUNNER
  # variable (unset or `hosted` = the hosted label, `xcode-27-local` = the dedicated Mac).
  macos-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      value: ${{ steps.r.outputs.value }}
    steps:
      - id: r
        uses: pyrlyn/ci/.github/actions/macos-runner@9675ff42a0e3785beabccb68b0e4fa65910de453 # main
        with:
          runner: ${{ vars.MACOS_RUNNER }}
          value: '["macos-15"]'

  # `docs-only` is "true" when every changed file is documentation (.github/infra.yml); it fails
  # open, so a failed `config` runs everything.
  config:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs-only: ${{ steps.config.outputs.docs-only }}
    steps:
      - id: config
        uses: pyrlyn/ci/.github/actions/config@9675ff42a0e3785beabccb68b0e4fa65910de453 # main

  # Each target builds and runs its tests on its own OS: Kotlin/Native runs test binaries only
  # for the host it is on, and the PTY cinterop (T8) differs per OS.
  build:
    name: ${{ matrix.os }} (${{ matrix.target }})
    needs: [config, macos-runner]
    # Draft PRs skip. A docs-only change still runs the job with every step a no-op, so the
    # required `<os> (<target>)` checks report instead of waiting.
    if: >-
      !cancelled()
      && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    # Fork PRs keep the hosted macOS label; MACOS_CI_DISABLED moves the macOS job to Ubuntu as a no-op.
    runs-on: ${{ vars.MACOS_CI_DISABLED == 'true' && startsWith(matrix.os, 'macos') && 'ubuntu-24.04' || startsWith(matrix.os, 'macos') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(needs.macos-runner.outputs.value)[0] || matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: macosArm64
            task: MacosArm64
          - os: ubuntu-24.04
            target: linuxX64
            task: LinuxX64
          - os: windows-2025
            target: mingwX64
            task: MingwX64
    defaults:
      run:
        shell: bash
    env:
      RUN: ${{ needs.config.outputs.docs-only != 'true' && !(vars.MACOS_CI_DISABLED == 'true' && startsWith(matrix.os, 'macos')) }}
      SKIP_TESTS: ${{ vars.SKIP_CI_TESTS == 'true' }}
    steps:
      - if: env.RUN == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - if: env.RUN == 'true'
        name: Install tools (mise.toml)
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install: true

      - if: env.RUN == 'true'
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - if: env.RUN == 'true'
        name: Cache the Kotlin/Native toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - if: env.RUN == 'true' && env.SKIP_TESTS != 'true'
        name: Check (tests and ktlint)
        run: ./gradlew check --console=plain

      # No machine here runs Windows, so this is where the T3 bench runs on it. The tables go to the
      # job summary rather than docs/benchmarks: a CI VM's numbers describe that run only. They go to
      # the log too, which `gh run view --log` reads without a GitHub sign-in, unlike the summary.
      - if: env.RUN == 'true' && env.SKIP_TESTS != 'true' && matrix.target == 'mingwX64'
        name: Benchmark (baseline and terminal tables)
        run: |
          ./gradlew :vesper-bench:linkReleaseExecutableMingwX64 --console=plain
          bench=vesper-bench/build/bin/mingwX64/releaseExecutable/vesper-bench.exe
          "$bench" build/baseline.md | tee -a "$GITHUB_STEP_SUMMARY"
          "$bench" term | tee -a "$GITHUB_STEP_SUMMARY"

      # The T3 reference terminals: Linux has packages for all but Warp, so they are installed in a
      # container and timed there, the table again to the job summary and the log. It downloads from mirrors and
      # releases outside this repository, so an outage there must not turn the build red.
      - if: env.RUN == 'true' && env.SKIP_TESTS != 'true' && matrix.target == 'linuxX64'
        name: Benchmark (reference terminals)
        continue-on-error: true
        timeout-minutes: 15
        run: |
          ./gradlew :vesper-bench:linkReleaseExecutableLinuxX64 --console=plain
          docker run --rm -v "$PWD":/w -w /w ubuntu@sha256:6a06111c3b0a8600feadb270aec771dc239bf407b25625f93f44ab00e11f4d3c \
            sh vesper-bench/terminals.sh build/baseline.md | tee -a "$GITHUB_STEP_SUMMARY"

      - if: env.RUN == 'true' && env.SKIP_TESTS == 'true'
        name: tests skipped (SKIP_CI_TESTS)
        run: echo "::notice title=SKIP_CI_TESTS::tests skipped by SKIP_CI_TESTS"

  # T25: the checks kept out of `./gradlew check`, which stays offline and repeatable. checkUcd
  # fails when the committed Unicode tables differ from what the pinned data files produce. The
  # fuzz smoke runs the seeded fuzz corpora of the parser, the stub and the image decoders for a
  # time budget from a fresh seed; a failure prints the VESPER_FUZZ_SEED that reproduces it.
  fuzz-unicode:
    name: fuzz and Unicode (linuxX64)
    needs: config
    if: >-
      !cancelled()
      && needs.config.outputs.docs-only != 'true'
      && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install tools (mise.toml)
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install: true

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Cache the Kotlin/Native toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml') }}

      # The data files are checked against the SHA-256s in Ucd.kt, so a cache keyed on it holds
      # exactly the pinned files and spares unicode.org a download per run.
      - name: Cache the Unicode data files
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vesper-unicode/build/ucd
          key: ucd-${{ hashFiles('build-logic/src/main/kotlin/vesper/ucd/Ucd.kt') }}

      - name: Unicode tables match the pinned data files
        run: ./gradlew :vesper-unicode:checkUcd --console=plain

      # Nine corpora at 30 s each; the image module's seven run one after another.
      - name: Fuzz smoke (30 s per corpus)
        env:
          VESPER_FUZZ_SECONDS: '30'
        run: ./gradlew :vesper-parser:linuxX64Test :vesper-harness:linuxX64Test :vesper-image:linuxX64Test --console=plain
